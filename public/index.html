<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walkie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0e0f11;
      --surface:   #16181c;
      --border:    #2a2d34;
      --amber:     #f5a623;
      --amber-dim: #7a5112;
      --green:     #3ddc84;
      --red:       #ff5f5f;
      --text:      #d8dbe2;
      --muted:     #5a5f6e;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Barlow', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .icon { font-size: 22px; }
    header h1 {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--amber);
      letter-spacing: 0.05em;
    }
    .live-dot {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .live-dot span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
    }
    .tab.active {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }

    /* ── Content ── */
    .panel { display: none; padding: 16px; max-width: 560px; margin: 0 auto; }
    .panel.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      padding: 11px 13px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--amber); }
    input::placeholder { color: var(--muted); }
    select option { background: var(--surface); }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-amber  { background: var(--amber);  color: #111; }
    .btn-green  { background: var(--green);  color: #111; }
    .btn-red    { background: var(--red);    color: #fff; }
    .btn-ghost  {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 8px 12px;
      width: auto;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Unit rows ── */
    .unit-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.25s ease;
    }
    .unit-row:last-child { border-bottom: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    .unit-num {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--amber);
      min-width: 48px;
    }
    .unit-info { flex: 1; min-width: 0; }
    .unit-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unit-time {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .badge-out { background: rgba(255,95,95,0.15); color: var(--red); }
    .badge-in  { background: rgba(61,220,132,0.12); color: var(--green); }

    /* ── Summary bar ── */
    .summary {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .summary-item {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .summary-num {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 400;
    }
    .summary-num.amber { color: var(--amber); }
    .summary-num.green { color: var(--green); }
    .summary-num.red   { color: var(--red);   }
    .summary-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 500;
      max-width: 90vw;
      text-align: center;
      transition: transform 0.3s ease, opacity 0.3s;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.ok   { border-color: var(--green); color: var(--green); }
    #toast.err  { border-color: var(--red);   color: var(--red);   }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: var(--muted);
      font-size: 13px;
      font-family: var(--mono);
    }

    .row-actions { display: flex; gap: 6px; }
  </style>
</head>
<body>

<header>
  <span class="icon">📻</span>
  <h1>WALKIE TRACKER</h1>
  <div class="live-dot"><span></span> LIVE</div>
</header>

<nav class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')">Dashboard</div>
  <div class="tab" onclick="switchTab('checkout')">Check Out</div>
  <div class="tab" onclick="switchTab('manage')">Manage Units</div>
</nav>

<!-- ── DASHBOARD ── -->
<div id="tab-dashboard" class="panel active">
  <div class="summary">
    <div class="summary-item">
      <div class="summary-num amber" id="sum-total">0</div>
      <div class="summary-label">Total</div>
    </div>
    <div class="summary-item">
      <div class="summary-num green" id="sum-in">0</div>
      <div class="summary-label">In Stock</div>
    </div>
    <div class="summary-item">
      <div class="summary-num red" id="sum-out">0</div>
      <div class="summary-label">Out</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚠ Checked Out</div>
    <div id="list-out"><div class="empty-state">No units checked out</div></div>
  </div>

  <div class="card">
    <div class="card-title">✓ In Stock</div>
    <div id="list-in"><div class="empty-state">No units available</div></div>
  </div>
</div>

<!-- ── CHECKOUT ── -->
<div id="tab-checkout" class="panel">
  <div class="card">
    <div class="card-title">Check Out a Unit</div>
    <label>Your Name</label>
    <input id="co-name" type="text" placeholder="e.g. Ahmad" autocomplete="off" />
    <label>Walkie-Talkie Unit</label>
    <select id="co-unit">
      <option value="">— Select an available unit —</option>
    </select>
    <button class="btn btn-amber" onclick="doCheckout()">CHECK OUT</button>
  </div>

  <div class="card">
    <div class="card-title">Return a Unit</div>
    <label>Unit to Return</label>
    <select id="ret-unit">
      <option value="">— Select a checked-out unit —</option>
    </select>
    <button class="btn btn-green" onclick="doReturn()">RETURN TO STATION</button>
  </div>
</div>

<!-- ── MANAGE ── -->
<div id="tab-manage" class="panel">
  <div class="card">
    <div class="card-title">Add New Unit</div>
    <label>Unit Number / Label</label>
    <input id="add-num" type="text" placeholder="e.g. WT-01 or 5" autocomplete="off" />
    <button class="btn btn-amber" onclick="doAddUnit()">ADD TO INVENTORY</button>
  </div>

  <div class="card">
    <div class="card-title">Current Inventory</div>
    <div id="list-manage"><div class="empty-state">No units registered yet</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
  let state = {};
  let activeTab = 'dashboard';

  // ── Tab switching ────────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      const names = ['dashboard', 'checkout', 'manage'];
      t.classList.toggle('active', names[i] === name);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    activeTab = name;
  }

  // ── Toast ────────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 2800);
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    return res.json();
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render(s) {
    state = s;
    const keys = Object.keys(s).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const out = keys.filter(k => s[k].status === 'checked_out');
    const avail = keys.filter(k => s[k].status === 'available');

    // Summary
    document.getElementById('sum-total').textContent = keys.length;
    document.getElementById('sum-in').textContent = avail.length;
    document.getElementById('sum-out').textContent = out.length;

    // Checked out list
    const listOut = document.getElementById('list-out');
    listOut.innerHTML = out.length ? out.map(k => `
      <div class="unit-row">
        <div class="unit-num">#${k}</div>
        <div class="unit-info">
          <div class="unit-name">${s[k].name}</div>
          <div class="unit-time">since ${formatTime(s[k].since)}</div>
        </div>
        <span class="badge badge-out">OUT</span>
      </div>`).join('') : '<div class="empty-state">All clear — nothing checked out</div>';

    // In stock list
    const listIn = document.getElementById('list-in');
    listIn.innerHTML = avail.length ? avail.map(k => `
      <div class="unit-row">
        <div class="unit-num">#${k}</div>
        <div class="unit-info"><div class="unit-name">Available</div></div>
        <span class="badge badge-in">IN</span>
      </div>`).join('') : '<div class="empty-state">No units in stock</div>';

    // Checkout selects
    const coSel = document.getElementById('co-unit');
    const retSel = document.getElementById('ret-unit');
    coSel.innerHTML = '<option value="">— Select an available unit —</option>' +
      avail.map(k => `<option value="${k}">#${k}</option>`).join('');
    retSel.innerHTML = '<option value="">— Select a checked-out unit —</option>' +
      out.map(k => `<option value="${k}">#${k} — ${s[k].name}</option>`).join('');

    // Manage list
    const listMgr = document.getElementById('list-manage');
    listMgr.innerHTML = keys.length ? keys.map(k => `
      <div class="unit-row">
        <div class="unit-num">#${k}</div>
        <div class="unit-info">
          <div class="unit-name">${s[k].status === 'checked_out' ? s[k].name : 'In stock'}</div>
        </div>
        <div class="row-actions">
          <span class="badge ${s[k].status === 'checked_out' ? 'badge-out' : 'badge-in'}">
            ${s[k].status === 'checked_out' ? 'OUT' : 'IN'}
          </span>
          ${s[k].status === 'available'
            ? `<button class="btn btn-ghost" onclick="doRemove('${k}')">✕</button>`
            : ''}
        </div>
      </div>`).join('') : '<div class="empty-state">No units registered yet</div>';
  }

  // ── Actions ──────────────────────────────────────────────────────────────
  async function doCheckout() {
    const name = document.getElementById('co-name').value.trim();
    const number = document.getElementById('co-unit').value;
    if (!name) { toast('Please enter your name.', 'err'); return; }
    if (!number) { toast('Please select a unit.', 'err'); return; }
    const r = await api('POST', '/api/checkout', { name, number });
    if (r.ok) {
      toast(`#${number} checked out to ${name} ✓`);
      document.getElementById('co-name').value = '';
    } else toast(r.error, 'err');
    poll();
  }

  async function doReturn() {
    const number = document.getElementById('ret-unit').value;
    if (!number) { toast('Please select a unit.', 'err'); return; }
    const r = await api('POST', `/api/return/${number}`);
    if (r.ok) toast(`#${number} returned to station ✓`);
    else toast(r.error, 'err');
    poll();
  }

  async function doAddUnit() {
    const number = document.getElementById('add-num').value.trim();
    if (!number) { toast('Please enter a unit number.', 'err'); return; }
    const r = await api('POST', '/api/units', { number });
    if (r.ok) {
      toast(`Unit #${number} added ✓`);
      document.getElementById('add-num').value = '';
    } else toast(r.error, 'err');
    poll();
  }

  async function doRemove(number) {
    const r = await api('DELETE', `/api/units/${number}`);
    if (r.ok) toast(`Unit #${number} removed`);
    else toast(r.error, 'err');
    poll();
  }

  // ── Polling (every 4 seconds) ────────────────────────────────────────────
  async function poll() {
    try {
      const s = await api('GET', '/api/state');
      render(s);
    } catch (e) {
      console.error('Poll error', e);
    }
  }

  poll();
  setInterval(poll, 4000);
</script>
</body>
</html>
